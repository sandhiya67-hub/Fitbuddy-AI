services:
  - type: web
    name: fitbuddy-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.routes:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MOCK_AI
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash